services:
  wedding-planner:
    build: .
    container_name: vowcraft-wedding-planner
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATA_DIR=/app/data
    volumes:
      - wedding_data:/app/data

volumes:
  wedding_data:
